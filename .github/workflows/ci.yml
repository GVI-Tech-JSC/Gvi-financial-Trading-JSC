name: CI — VNKR Trade

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: "10" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend run lint   || true
      - run: pnpm --filter frontend run lint  || true
      - run: pnpm --filter backend run build  || true
      - run: pnpm --filter frontend run build || true
