# VNKR Trade — Nginx Dev Config
# Author: NGUYEN THI THU HUONG | GVI Tech JSC
# Dev: frontend=3001, backend=4001

server {
  listen 80;
  server_name trading.vnkr.vn;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
    try_files $uri =404;
  }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name trading.vnkr.vn;

  ssl_certificate     /etc/letsencrypt/live/trading.vnkr.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trading.vnkr.vn/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  # WebSocket support
  location /socket.io/ {
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://127.0.0.1:4001/socket.io/;
  }

  location /api/docs { proxy_pass http://127.0.0.1:4001/api/docs; }

  location /api {
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://127.0.0.1:4001/api;
  }

  location /uploads { proxy_pass http://127.0.0.1:4001/uploads; }

  location / { proxy_pass http://127.0.0.1:3001/; }

  access_log /var/log/nginx/vnkr-trade-dev-access.log;
  error_log  /var/log/nginx/vnkr-trade-dev-error.log warn;
}
